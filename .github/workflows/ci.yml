name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EventTicketingSystem.slnx

      - name: Build
        run: dotnet build EventTicketingSystem.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test EventTicketingSystem.slnx --no-build --configuration Release